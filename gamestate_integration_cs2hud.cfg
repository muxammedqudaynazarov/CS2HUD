// CS2HUD — Game State Integration Config
// ──────────────────────────────────────────────────────────────────────
// ⚠️  LAN SETUP: Bu faylni qo'lda tahrirlash shart EMAS!
//
//  Gaming PC'dan quyidagi URL'ni oching va faylni yuklab oling:
//    http://<SERVER_IP>:3000/setup
//
//  Server avtomatik o'zining IP manzilini bu faylga yozib beradi.
// ──────────────────────────────────────────────────────────────────────
//
//  Agar qo'lda o'zgartirmoqchi bo'lsangiz:
//    "uri" qatoridagi IP ni server kompyuterining IP manzili bilan almashtiring.
//
//  Faylni CS2 cfg papkasiga joylashtiring:
//    C:\...\Counter-Strike Global Offensive\game\csgo\cfg\
// ──────────────────────────────────────────────────────────────────────

"CS2HUD"
{
    "uri"           "http://YOUR_SERVER_IP:3000/gsi"
    "timeout"       "5.0"
    "heartbeat"     "10.0"
    "auth"
    {
        "token"     "cs2hud_2024"
    }
    "data"
    {
        "provider"               "1"
        "map"                    "1"
        "round"                  "1"
        "player_id"              "1"
        "allplayers_id"          "1"
        "allplayers_state"       "1"
        "allplayers_match_stats" "1"
        "allplayers_weapons"     "1"
        "allplayers_position"    "0"
        "bomb"                   "1"
        "grenades"               "1"
        "previously"             "1"
    }
}
